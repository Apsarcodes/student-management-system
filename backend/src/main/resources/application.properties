spring.application.name=student-management-system
server.port=${PORT:8080}

# Active profile: 'mysql' for local MySQL server, or 'dev' for embedded H2
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# JWT Settings
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Logging
logging.level.com.sms=INFO
logging.level.org.springframework.jdbc=INFO

# Seed User Passwords (optional - used by DatabaseInitializer)
app.seed.admin-password=${ADMIN_SEED_PASSWORD:#{null}}
app.seed.faculty-password=${FACULTY_SEED_PASSWORD:#{null}}
app.seed.student-password=${STUDENT_SEED_PASSWORD:#{null}}
